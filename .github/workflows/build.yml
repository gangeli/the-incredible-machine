name: Build, test and publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit, behaviour and screenshot tests (JVM)
        run: ./gradlew :core:test --no-daemon
      - name: Activity test (Robolectric)
        run: ./gradlew :app:testDebugUnitTest --no-daemon
      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon
      - name: Report APK size
        run: ls -la app/build/outputs/apk/release/ && stat -c "%s bytes" app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: incredible-machine-apk
          path: app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: |
            core/build/snaps/*.png
            app/build/snaps/*.png
      - name: Attach APK to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk

  # Deploys docs/ (plus the freshly built APK) to GitHub Pages. Requires Pages to be enabled once
  # in the repository settings with "Source: GitHub Actions"; until then this job is allowed to fail.
  pages:
    needs: build
    if: github.ref == 'refs/heads/main'
    continue-on-error: true
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/download-artifact@v4
        with:
          name: incredible-machine-apk
          path: docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
